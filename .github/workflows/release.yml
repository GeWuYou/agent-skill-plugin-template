name: Release

on:
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  preview:
    name: Semantic release preview
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.preview.outputs.shouldRelease }}
      last_tag: ${{ steps.preview.outputs.lastTag }}
      next_version: ${{ steps.preview.outputs.nextVersion }}
      next_tag: ${{ steps.preview.outputs.nextTag }}
      trigger_sha: ${{ steps.preview.outputs.triggerSha }}
      release_notes_b64: ${{ steps.notes.outputs.value }}
    steps:
      - name: Require main
        if: ${{ github.ref != 'refs/heads/main' }}
        run: |
          echo "::error::Stable releases must be dispatched from main."
          exit 1

      - name: Checkout main for the dispatch snapshot
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: main

      - name: Verify the fixed main snapshot
        env:
          DISPATCH_SHA: ${{ github.sha }}
        run: |
          git fetch origin +refs/heads/main:refs/remotes/origin/main --tags
          test "$(git branch --show-current)" = "main"
          test "$(git rev-parse HEAD)" = "$DISPATCH_SHA"
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run the serial quality chain
        run: |
          bun run typecheck
          bun run build
          bun test generator/test template/tests tests
          bun run validate
          bun run check

      - name: Preview automatic version
        id: preview
        run: bun run release:preview --github-output "$GITHUB_OUTPUT"

      - name: Encode release notes
        id: notes
        run: |
          value="$(jq -r '.releaseNotes' release-preview.json | base64 -w 0)"
          echo "value=${value}" >> "$GITHUB_OUTPUT"

      - name: Summarize preview
        env:
          SHOULD_RELEASE: ${{ steps.preview.outputs.shouldRelease }}
          LAST_TAG: ${{ steps.preview.outputs.lastTag }}
          NEXT_VERSION: ${{ steps.preview.outputs.nextVersion }}
          NEXT_TAG: ${{ steps.preview.outputs.nextTag }}
        run: |
          {
            echo "## Release preview"
            echo
            echo "- Commit: \`${{ github.sha }}\`"
            echo "- Should release: \`${SHOULD_RELEASE}\`"
            echo "- Last tag: \`${LAST_TAG}\`"
            echo "- Next version: \`${NEXT_VERSION:-none}\`"
            echo "- Next tag: \`${NEXT_TAG:-none}\`"
            if [ "$SHOULD_RELEASE" = "false" ]; then
              echo "- Result: no releasable Conventional Commits; no tag or Release will be created."
            else
              echo "- Next step: approve the protected \`release\` environment."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  validate-release-environment:
    name: Validate release environment
    needs: preview
    if: ${{ needs.preview.outputs.should_release == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Require at least one reviewer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          response="$(mktemp)"
          status="$(curl --silent --show-error --output "$response" --write-out '%{http_code}' \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            "${{ github.api_url }}/repos/${{ github.repository }}/environments/release")"
          if [ "$status" != "200" ]; then
            echo "::error::The release environment could not be read (HTTP ${status})."
            cat "$response"
            exit 1
          fi
          reviewers="$(jq '[.protection_rules[]? | select(.type == "required_reviewers") | .reviewers[]?] | length' "$response")"
          if [ "$reviewers" -lt 1 ]; then
            echo "::error::Configure at least one required reviewer on the release environment."
            exit 1
          fi

  publish:
    name: Publish stable release
    needs: [preview, validate-release-environment]
    if: ${{ needs.preview.outputs.should_release == 'true' }}
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - name: Checkout main for the approved snapshot
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: main

      - name: Refetch and verify the approved main snapshot
        env:
          EXPECTED_SHA: ${{ needs.preview.outputs.trigger_sha }}
        run: |
          git fetch origin +refs/heads/main:refs/remotes/origin/main --tags
          test "$(git branch --show-current)" = "main"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Recalculate and publish approved tag
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          bun run release:prepare
          --expected-sha "${{ needs.preview.outputs.trigger_sha }}"
          --expected-version "${{ needs.preview.outputs.next_version }}"
          --expected-tag "${{ needs.preview.outputs.next_tag }}"

      - name: Build deterministic release assets
        run: bun run package --version "${{ needs.preview.outputs.next_version }}"

      - name: Restore approved release notes
        env:
          RELEASE_NOTES_B64: ${{ needs.preview.outputs.release_notes_b64 }}
        run: printf '%s' "$RELEASE_NOTES_B64" | base64 --decode > release-notes.md

      - name: Create or verify GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          NEXT_TAG: ${{ needs.preview.outputs.next_tag }}
        run: |
          set -euo pipefail
          if gh release view "$NEXT_TAG" >/dev/null 2>&1; then
            existing="$(mktemp -d)"
            gh release download "$NEXT_TAG" --dir "$existing"
            for asset in dist/release/*; do
              name="$(basename "$asset")"
              test -f "$existing/$name"
              cmp --silent "$asset" "$existing/$name"
            done
            echo "Existing release and assets match the approved snapshot."
          else
            gh release create "$NEXT_TAG" dist/release/* --verify-tag --latest --notes-file release-notes.md --title "$NEXT_TAG"
          fi

      - name: Summarize publication
        run: |
          {
            echo "## Stable release"
            echo
            echo "- Commit: \`${{ needs.preview.outputs.trigger_sha }}\`"
            echo "- Version: \`${{ needs.preview.outputs.next_version }}\`"
            echo "- Tag: \`${{ needs.preview.outputs.next_tag }}\`"
            echo "- Assets: source archive, checksums, and provenance"
          } >> "$GITHUB_STEP_SUMMARY"
