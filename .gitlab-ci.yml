include:
  - project: 'catalytic-ci-platform/pr-agent-ci-templates'
    ref: 'main'
    file: '/templates/pr-agent-mr.yml'

workflow:
  rules:
    # Run the dedicated merge request pipeline so the central PR-Agent job is included.
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    # Avoid a duplicate branch pipeline while an MR is already open.
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS && $CI_PIPELINE_SOURCE == "push"'
      when: never
    - if: '$CI_COMMIT_BRANCH || $CI_COMMIT_TAG'
    - when: never

image: node:22-bookworm
stages: [quality, package, publish]
variables:
  GIT_DEPTH: "0"
before_script:
  - curl -fsSL https://bun.sh/install | bash -s -- bun-v1.3.14
  - export PATH="$HOME/.bun/bin:$PATH"
  - bun --version
quality:
  stage: quality
  tags: [docker]
  script:
    - bun install --frozen-lockfile
    - bun run typecheck
    - bun run build
    - bun run test
    - bun run validate
    - bun run check
package:
  stage: package
  tags: [docker]
  needs: [quality]
  script:
    - mkdir -p dist/release
    - export RELEASE_VERSION="${CI_COMMIT_TAG#v}"
    - export PLUGIN_VERSION="$RELEASE_VERSION"
    - bun run ci/package-template.mjs
  artifacts:
    paths: [dist/release/]
    expire_in: 30 days
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-beta\.([1-9][0-9]*))?$/'
publish:
  stage: publish
  tags: [docker]
  needs: [package]
  script:
    - bun run ci/publish-gitlab.mjs
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-beta\.([1-9][0-9]*))?$/'
      when: manual
  allow_failure: false
manual-release:
  stage: publish
  tags: [docker]
  environment:
    name: production
  resource_group: "agent-skill-plugin-template-manual-$RELEASE_VERSION"
  needs: [quality]
  script:
    - bun run ci/manual-release-gitlab.mjs
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_REF_PROTECTED == "true"'
      when: manual
    - when: never
  allow_failure: false
